prompts:  # id: [entrada, saida, proibe, teste, aceita]
  P1: [pedido, "{formula, parametros[{nome,valor,min,max}], explicacao, ambiguidades}", codigo_livre ∨ fora_DSL, 200 casos PT/EN, "≥95% ∧ 100% inválidas rejeitadas"]
  P2: [metricas, 2 forças + 2 fraquezas + 1 sugestão, inventar_numeros ∨ prometer_lucro, 50 casos analista, "≥90% útil"]
  P3: [formulario, lacunas ≤5/ronda, adivinhar_dados, 20 incompletos, 100% lacunas]
  P4: [dados+fontes, secções C, numero_sem_fonte, 10 planos, 0 sem origem]
  P5: [titulo+desc+avaliacoes, aprovado|rejeitado+motivo, —, 100 casos, "≥95%"]
loops:  # id: [ciclo, sai_quando, limite]
  L1: [testes P1 → erros → ajustar → repetir, "≥95% em 2 corridas", 5 iter → humano]
  L2: [calcular → vs buy&hold → dados suficientes, resultado gravado, sem backtest ⇒ não publica]
  L3: [recalcular → comparar, igual ao cêntimo 2x, diferença ⇒ bloqueia nota]
  L4: [gerar → verificar secções/fontes → corrigir → regenerar, todas secções ∧ fontes, 3 rondas]
  L5: [sinal → limites → IA+humano → executar → reconciliar, executado ∧ reconciliado, limite violado ⇒ pára + alerta]
  L6: [publicar → KPIs → 5 entrevistas → priorizar, KPIs da fase, quinzenal]
